name: Build Windows Desktop Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build VLC 11 Player Windows Installer
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build Vite renderer
        run: npm run build

      - name: Build Electron NSIS Windows Installer
        run: npm run dist:win

      - name: Verify Windows Installer Output
        shell: pwsh
        run: |
          if (-not (Test-Path "release\VLC-11-Player-Setup.exe")) {
            Write-Error "Installer binary release\VLC-11-Player-Setup.exe was not found!"
            Get-ChildItem -Path release -Recurse
            exit 1
          }
          $item = Get-Item "release\VLC-11-Player-Setup.exe"
          Write-Host "Success! Generated installer: $($item.FullName) ($([math]::Round($item.Length / 1MB, 2)) MB)"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLC-11-Player-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
