name: Publish Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag or Version to release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  publish-windows-release:
    name: Build & Publish VLC 11 Player Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain dependencies
        run: npm ls vite @vitejs/plugin-react @tailwindcss/vite

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build Vite renderer
        run: npm run build

      - name: Build Electron NSIS Windows Installer
        run: npm run dist:win

      - name: Verify Windows Installer Output
        shell: pwsh
        run: |
          if (-not (Test-Path "release\VLC-11-Player-Setup.exe")) {
            Write-Error "Installer binary release\VLC-11-Player-Setup.exe was not found!"
            exit 1
          }
          $item = Get-Item "release\VLC-11-Player-Setup.exe"
          Write-Host "Success! Installer ready for release: $($item.FullName) ($([math]::Round($item.Length / 1MB, 2)) MB)"

      - name: Create GitHub Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          name: "VLC 11 Player ${{ github.ref_name || inputs.tag_name }}"
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
